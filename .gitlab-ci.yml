include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - test
  
test_backend:
  stage: test
  image: node:22
  script:
    - npm ci
    - node --check server.js

test_frontend:
  stage: test
  image: node:22
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build

